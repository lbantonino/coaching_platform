<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:8px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#17151d">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
<sc-if value="{{ it.leaf }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px 8px 8px;border-radius:14px;background:#fff;box-shadow:{{ it.ring }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#c9c7d1" style="flex:none"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg>
<sc-if value="{{ it.thumb }}"><span style="width:42px;height:42px;flex:none;border-radius:11px;background:#ecebf1"></span></sc-if><sc-if value="{{ it.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:4px;height:38px;flex:none;border-radius:2px;background:{{ it.bar }}"></span></sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:600 14.5px 'Plus Jakarta Sans';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.t }}</span><span style="font:400 12.5px/1.4 'Plus Jakarta Sans';color:#64626e">{{ it.s }}</span></div>
<span style="font:600 14px 'Plus Jakarta Sans';white-space:nowrap">{{ it.r }}</span>
</div></sc-if>
<sc-if value="{{ it.group }}"><div style="border-radius:17px;background:{{ it.bg }};box-shadow:{{ it.ring }};padding:10px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 4px 0 6px;min-height:32px">
<span style="display:flex;align-items:center;gap:7px;font:600 14px 'Plus Jakarta Sans';color:{{ it.tc }};white-space:nowrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</span>
<sc-if value="{{ it.stepper }}"><span style="display:flex;align-items:center;height:30px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px rgba(22,18,40,.12);font:600 14px 'Plus Jakarta Sans'"><span style="width:30px;text-align:center;color:#64626e">−</span><span style="min-width:22px;text-align:center">{{ it.stepper }}</span><span style="width:30px;text-align:center;color:#64626e">+</span></span></sc-if>
<span style="flex:1;min-width:0;font:400 12.5px 'Plus Jakarta Sans';color:#4a4855;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.meta }}</span>
<span style="font:700 14px 'Plus Jakarta Sans';letter-spacing:1px;color:#8a8896">···</span>
</div>
<div style="position:relative;display:flex;flex-direction:column;gap:6px;padding-left:{{ it.pad }}"><sc-if value="{{ it.linked }}"><span style="position:absolute;left:8px;top:26px;bottom:26px;width:2px;border-radius:1px;background:{{ it.tc }}"></span></sc-if>
<sc-for list="{{ it.kids }}" as="k" hint-placeholder-count="2"><div style="position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 12px 8px 8px;border-radius:13px;background:#fff;box-shadow:{{ k.ring }}"><sc-if value="{{ it.linked }}"><span style="position:absolute;left:-15px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:{{ it.tc }};box-shadow:0 0 0 2px {{ it.bg }}"></span></sc-if>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#c9c7d1" style="flex:none"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg>
<sc-if value="{{ k.thumb }}"><span style="width:38px;height:38px;flex:none;border-radius:10px;background:#ecebf1"></span></sc-if><sc-if value="{{ k.noThumb }}" hint-placeholder-val="{{ true }}"><span style="width:4px;height:34px;flex:none;border-radius:2px;background:{{ k.bar }}"></span></sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font:600 14px 'Plus Jakarta Sans';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.t }}</span><span style="font:400 12.5px/1.4 'Plus Jakarta Sans';color:#64626e">{{ k.s }}</span></div>
<span style="font:600 13.5px 'Plus Jakarta Sans';white-space:nowrap">{{ k.r }}</span>
</div></sc-for>
<span style="min-height:40px;border-radius:12px;display:flex;align-items:center;gap:7px;padding:0 12px;font:500 13px 'Plus Jakarta Sans';color:{{ it.tc }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ it.addKid }}</span>
</div>
</div></sc-if>
</sc-for>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ adds }}" as="a" hint-placeholder-count="2"><span style="flex:1 1 140px;min-height:46px;border-radius:14px;box-shadow:inset 0 0 0 1.5px rgba(22,18,40,.10);display:flex;align-items:center;justify-content:center;gap:7px;font:500 13.5px 'Plus Jakarta Sans';color:#4a4855;white-space:nowrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ a }}</span></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:600},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;adds&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}"></script>
</body>
</html>
