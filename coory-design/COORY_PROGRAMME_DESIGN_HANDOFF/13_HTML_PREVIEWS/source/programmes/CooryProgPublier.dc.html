<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:18px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#17151d">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font:700 22px/1.2 'Plus Jakarta Sans';letter-spacing:-.02em">Publier le programme ?</span><span style="font:400 14px/1.5 'Plus Jakarta Sans';color:#64626e">Inès verra cette version dans son espace, et les PDF seront tirés de cette version.</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><sc-for list="{{ sum }}" as="s" hint-placeholder-count="3"><div style="padding:12px;border-radius:13px;background:#f6f5fa;display:flex;flex-direction:column;gap:2px"><span style="font:400 12px 'Plus Jakarta Sans';color:#64626e">{{ s.l }}</span><span style="font:700 17px 'Plus Jakarta Sans';white-space:nowrap">{{ s.v }}</span></div></sc-for></div>
<div style="display:flex;flex-direction:column;gap:8px"><sc-for list="{{ warn }}" as="w" hint-placeholder-count="2"><div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(22,18,40,.10)"><span style="width:22px;height:22px;flex:none;border-radius:50%;background:{{ w.bg }};color:{{ w.c }};display:flex;align-items:center;justify-content:center;font:700 13px 'Plus Jakarta Sans'">!</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:600 14px 'Plus Jakarta Sans'">{{ w.t }}</span><span style="font:400 13px/1.45 'Plus Jakarta Sans';color:#64626e">{{ w.s }}</span></span><span style="font:600 13px 'Plus Jakarta Sans';color:#6a3ee0;white-space:nowrap">Voir</span></div></sc-for></div>
<span style="font:400 12.5px 'Plus Jakarta Sans';color:#8a8896">Rien n’est bloquant : tu peux publier et compléter ensuite (cela créera une version 3).</span>
<div style="display:flex;flex-direction:{{ dir }};gap:8px"><span style="flex:{{ fl }};height:48px;border-radius:13px;background:#17151d;color:#fff;display:flex;align-items:center;justify-content:center;font:600 15px 'Plus Jakarta Sans';order:{{ o1 }}">Publier la version 2</span><span style="flex:{{ fl }};height:48px;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(22,18,40,.14);display:flex;align-items:center;justify-content:center;font:600 15px 'Plus Jakarta Sans';order:{{ o2 }}">Annuler</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:460},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile;
    return {
      dir: m ? 'column' : 'row', fl: m ? '0 0 48px' : '1', o1: m ? 0 : 2, o2: m ? 1 : 1,
      sum: [{ l: 'Semaines', v: '12' }, { l: 'Séances', v: '48' }, { l: 'Version créée', v: 'Version 2' }],
      warn: [{ t: '2 séances sont encore à remplir', s: 'Semaine 11 · séances 3 et 4. Inès les verra « À venir ».', bg: '#fff1cc', c: '#8a6200' },
        { t: 'Semaine 8 sans séance avec le coach', s: 'Normal si c’est volontaire.', bg: '#f3f2f7', c: '#4a4855' }]
    };
  }
}
</script>
</body>
</html>
